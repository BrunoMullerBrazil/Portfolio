<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Marker;src:url(fonts/permanent-marker-latin-400-normal.woff2)}
@font-face{font-family:Hand;src:url(fonts/patrick-hand-latin-400-normal.woff2)}
@font-face{font-family:Oswald;font-weight:500;src:url(fonts/oswald-latin-500-normal.woff2)}
@font-face{font-family:Oswald;font-weight:600;src:url(fonts/oswald-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Mono;font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:Mono;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div style="position:absolute;left:-9999px;font-family:Marker">a</div><div style="position:absolute;left:-9999px;font-family:Hand">a</div>
<div style="position:absolute;left:-9999px;font-family:Oswald;font-weight:600">a</div><div style="position:absolute;left:-9999px;font-family:Inter">a</div>
<div style="position:absolute;left:-9999px;font-family:Mono">a</div>
<script>
const W=1080,H=1920,FPS=24;
const C={carvao:'#141414',papel:'#E9DFC8',ambar:'#E08A2E',ciano:'#3E6A73',verm:'#A3321F',laranja:'#C8662E',ink:'#1d1914',pencil:'#5b5349'};
const cv=document.getElementById('c'),X=cv.getContext('2d');
let T=0;

// ---------- utils ----------
function h1(a){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function h2(a,b){return h1(Math.imul(a|0,7919)+Math.imul(b|0,104729)+12345);}
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const mix=(a,b,p)=>a+(b-a)*p;
function noise1(x,s=0){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return mix(h2(i,s),h2(i+1,s),u)*2-1;}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

// ---------- textures ----------
function paperTex(w,h,base,seed){
  const c=mk(w,h),g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,h);
  const id=g.getImageData(0,0,w,h),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(h1(i+seed)-.5)*18;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(id,0,0);
  for(let i=0;i<40;i++){const x=h2(i,seed)*w,y=h2(i,seed+1)*h,r=60+h2(i,seed+2)*260;
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(120,95,55,0.10)');gr.addColorStop(1,'rgba(120,95,55,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
  g.strokeStyle='rgba(90,80,60,0.08)';g.lineWidth=1;
  for(let i=0;i<500;i++){const x=h2(i,seed+3)*w,y=h2(i,seed+4)*h,a=h2(i,seed+5)*6.28,l=6+h2(i,seed+6)*22;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  return c;
}
function darkTex(w,h,base,seed,amt=14){
  const c=mk(w,h),g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,w,h);
  const id=g.getImageData(0,0,w,h),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(h1(i*3+seed)-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(id,0,0);return c;
}
const GR=[];for(let k=0;k<8;k++){const c=mk(540,960),g=c.getContext('2d'),id=g.createImageData(540,960),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=h1(i+k*999331)*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}g.putImageData(id,0,0);GR.push(c);}
let PAGE,PAGE2,WALL,FLOOR,TABLE,ROOM;
const PAGE_H=5600;
function rulePage(c,top){const g=c.getContext('2d');g.strokeStyle='rgba(70,95,110,0.16)';g.lineWidth=2;
  for(let y=top;y<c.height;y+=78){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke();}
  g.strokeStyle='rgba(163,50,31,0.22)';g.beginPath();g.moveTo(96,0);g.lineTo(96,c.height);g.stroke();}

// ---------- drawing helpers ----------
function seg(a,b,n=8){const p=[];for(let i=0;i<=n;i++)p.push([mix(a[0],b[0],i/n),mix(a[1],b[1],i/n)]);return p;}
function poly(pts,n=6,close=false){let o=[];const L=close?pts.length:pts.length-1;for(let i=0;i<L;i++){const s=seg(pts[i],pts[(i+1)%pts.length],n);if(i)s.shift();o=o.concat(s);}return o;}
function ell(cx,cy,rx,ry,n=40,a0=0,a1=Math.PI*2){const p=[];for(let i=0;i<=n;i++){const a=mix(a0,a1,i/n);p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
function ink(g,pts,o={}){
  const w=o.w||5,col=o.c||C.ink,amp=o.amp??2.2,seed=o.seed||1,p=o.p??1,boil=o.boil??true;
  const bf=boil?Math.floor(T*8):0,n=Math.max(2,Math.floor(pts.length*cl(p)));if(p<=0)return;
  g.beginPath();
  for(let i=0;i<n;i++){const q=pts[i];const dx=(h2(seed*31+i,bf)-.5)*2*amp,dy=(h2(seed*57+i,bf+99)-.5)*2*amp;i?g.lineTo(q[0]+dx,q[1]+dy):g.moveTo(q[0]+dx,q[1]+dy);}
  if(o.close&&p>=1)g.closePath();
  if(o.fill){g.fillStyle=o.fill;g.fill();}
  g.lineWidth=w;g.strokeStyle=col;g.lineJoin='round';g.lineCap='round';g.globalAlpha*=o.a??1;g.stroke();g.globalAlpha=1;
}
function fillPts(g,pts,col){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fillStyle=col;g.fill();}
// handwritten write-on. lines: array of strings. p: 0..1
function write(g,lines,x,y,lh,p,font,col,o={}){
  g.font=font;g.fillStyle=col;g.textBaseline='alphabetic';
  const tot=lines.reduce((s,l)=>s+l.length,0);let ch=cl(p)*tot;
  lines.forEach((ln,i)=>{
    const ly=y+i*lh;const lx=o.center?x-g.measureText(ln).width/2:x;
    if(ch<=0)return;const n=Math.min(ln.length,ch);ch-=ln.length;
    const k=Math.floor(n);let cw=g.measureText(ln.slice(0,k)).width;if(k<ln.length)cw+=(n-k)*g.measureText(ln[k]||' ').width;
    g.save();g.beginPath();g.rect(lx-20,ly-lh,cw+20,lh*1.4);g.clip();
    // slight per-line hand jitter
    const j=(h2(i,Math.floor(T*8)+7)-.5)*1.4;g.fillText(ln,lx+j,ly+j*.5);g.restore();
  });
}
function textW(g,s,font){g.font=font;return g.measureText(s).width;}
function sub(t0,t1,txt,o={}){
  if(T<t0||T>t1)return;const a=Math.min(lin(T,t0,t0+.18),1-lin(T,t1-.18,t1));
  X.save();X.globalAlpha=a;X.font=o.font||'500 52px Inter';X.textAlign='center';X.textBaseline='middle';
  const y=o.y||1430;X.shadowColor='rgba(0,0,0,.9)';X.shadowBlur=18;X.fillStyle=o.c||C.papel;
  const lines=txt.split('\n');lines.forEach((l,i)=>X.fillText(l,540,y+i*66));X.restore();
}
function typed(t0,cps,s){return s.slice(0,Math.max(0,Math.floor((T-t0)*cps)));}
function vignette(s=.75){const g=X.createRadialGradient(540,900,300,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${s})`);X.fillStyle=g;X.fillRect(0,0,W,H);}
function grain(a=.07){X.save();X.globalAlpha=a;X.globalCompositeOperation='overlay';X.drawImage(GR[Math.floor(T*24)%8],0,0,W,H);X.restore();}
function flicker(s=1){return 1+s*(noise1(T*9,3)*.06+noise1(T*23,4)*.03);}

// ---------- SCENES ----------
function waveLine(env,col){
  X.fillStyle='#0a0a0a';X.fillRect(0,0,W,H);
  X.beginPath();for(let x=0;x<=W;x+=4){const u=x/W,win=Math.sin(Math.PI*u);
    const y=960+win*env*(Math.sin(x*.045+T*40)*70*noise1(x*.02+T*6,1)+Math.sin(x*.13-T*55)*35*noise1(x*.05+T*9,2))+ (h2(x,Math.floor(T*24))-.5)*3;
    x?X.lineTo(x,y):X.moveTo(x,y);}
  X.strokeStyle=col;X.lineWidth=3;X.shadowColor=col;X.shadowBlur=14;X.stroke();X.shadowBlur=0;
}
function speechEnv(t,a,b,s=5){if(t<a||t>b)return .04;return .25+.75*Math.abs(noise1(t*7,s))*Math.min(lin(t,a,a+.1),1-lin(t,b-.1,b));}

function S1(){ // 0-4
  waveLine(speechEnv(T,.3,3.6),C.ambar);
  const s=typed(2.0,7,'DIA 41');X.font='400 64px Mono';X.fillStyle=C.papel;X.textAlign='center';
  X.letterSpacing='18px';X.fillText(s+(Math.floor(T*3)%2&&s.length<6?'_':''),540,1120);X.letterSpacing='0px';X.textAlign='left';
}

let CITY;
function buildCity(){
  const L=[[],[],[]];
  let x=-200;while(x<1300){const w=50+h1(x*3)*110,h=110+h1(x*5)*260;L[0].push([x,w,h,0]);x+=w+3;}
  x=-250;while(x<1350){const w=80+h1(x*7+1)*150,h=180+h1(x*11+1)*360;L[1].push([x,w,h,h1(x*13)>.55?1:0]);x+=w+14;}
  L[2]=[[-260,400,760,1],[-80,200,560,0],[920,420,820,1],[800,160,520,0]];
  CITY=L;
}
function S2(){ // 4-14
  const p=eio(lin(T,4,14));
  const g=X.createLinearGradient(0,0,0,1500);g.addColorStop(0,'#070b0e');g.addColorStop(1,'#16242a');X.fillStyle=g;X.fillRect(0,0,W,H);
  for(let i=0;i<340;i++){const x=h2(i,1)*W,y=h2(i,2)*1300,r=.6+h2(i,3)*1.8,tw=.5+.5*Math.sin(T*(1+h2(i,4)*3)+i);X.fillStyle=`rgba(233,223,200,${.25+.6*tw*h2(i,5)})`;X.fillRect(x,y,r,r);}
  const mx=760,my=430;const mg=X.createRadialGradient(mx,my,0,mx,my,260);mg.addColorStop(0,'rgba(233,223,200,.22)');mg.addColorStop(1,'rgba(233,223,200,0)');X.fillStyle=mg;X.fillRect(mx-260,my-260,520,520);
  X.fillStyle='#e6dcc4';X.beginPath();X.arc(mx,my,62,0,7);X.fill();X.fillStyle='rgba(150,140,120,.25)';X.beginPath();X.arc(mx-18,my-10,14,0,7);X.arc(mx+20,my+18,9,0,7);X.fill();
  const cols=['#1c2c33','#0f191d','#050809'],ks=[.03,.07,.14],gy=1600;
  CITY.forEach((layer,li)=>{X.save();const s=1+ks[li]*p;X.translate(540,1000);X.scale(s,s);X.translate(-540,-1000);
    X.fillStyle=cols[li];layer.forEach(([x,w,h,tank])=>{X.fillStyle=cols[li];X.fillRect(x,gy-h,w,h+400);
      if(li==1){X.fillStyle='rgba(150,175,180,.07)';for(let wy=gy-h+24;wy<gy-10;wy+=34)for(let wx=x+12;wx<x+w-14;wx+=26)if(h2(wx,wy)>.35)X.fillRect(wx,wy,12,16);X.fillStyle=cols[li];}
      if(li==1){const rg=X.createLinearGradient(x,0,x+w,0);rg.addColorStop(0,'rgba(200,210,200,.06)');rg.addColorStop(.3,'rgba(0,0,0,0)');X.fillStyle=rg;X.fillRect(x,gy-h,w,h);X.fillStyle=cols[li];}
      if(tank){X.fillRect(x+w*.2,gy-h-60,w*.32,60);X.fillRect(x+w*.62,gy-h-110,4,110);}
      if(li==0&&h1(x)>.6)X.fillRect(x+w/2,gy-h-70,3,70);});
    X.restore();});
  // bird
  if(T>6&&T<10){const u=lin(T,6,10),bx=mix(-60,1140,u),by=mix(760,640,u)+Math.sin(u*9)*20,f=Math.sin(T*22)*18;
    X.strokeStyle='#0b1215';X.lineWidth=5;X.lineCap='round';X.beginPath();X.moveTo(bx-28,by-f);X.lineTo(bx,by);X.lineTo(bx+28,by-f);X.stroke();}
  vignette(.8);
  sub(4.9,8.0,'Quarenta e um dias sem luz.');sub(8.2,10.6,'Eu sei porque conto.');sub(11.0,13.9,'Só não lembro de metade deles.');
}

function bottlePts(){const p=[[-20,-250],[20,-250],[20,-215],[34,-200],[60,-160],[86,-110],[90,-60],[90,200],[80,232],[-80,232],[-90,200],[-90,-60],[-86,-110],[-60,-160],[-34,-200],[-20,-215]];return poly(p,4,true);}
function S3(){ // 14-17
  X.drawImage(ROOM,0,0);
  const wx=150,wy=260,ww=420,wh=700;const wg=X.createLinearGradient(wx,wy,wx+ww,wy+wh);wg.addColorStop(0,'#55686a');wg.addColorStop(1,'#26302f');
  X.fillStyle=wg;X.fillRect(wx,wy,ww,wh);
  X.fillStyle='#0d0d0c';X.fillRect(wx+ww/2-8,wy,16,wh);X.fillRect(wx,wy+wh*.45,ww,16);X.lineWidth=22;X.strokeStyle='#0d0d0c';X.strokeRect(wx,wy,ww,wh);
  const lg=X.createRadialGradient(360,600,50,360,700,900);lg.addColorStop(0,'rgba(110,140,145,.18)');lg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=lg;X.fillRect(0,0,W,H);
  const rot=mix(2.5,Math.PI,eio(lin(T,14,14.9)))+Math.sin(T*3)*.015;
  X.save();X.translate(400,700);X.rotate(rot);
  const bp=bottlePts();fillPts(X,bp,'rgba(150,170,170,.10)');ink(X,bp,{w:5,c:'#b9c6c2',seed:3,close:true,amp:1.6});
  ink(X,seg([-90,-60],[90,-60],12),{w:3,c:'#9fb0ad',seed:4,a:.7});ink(X,seg([-90,150],[90,150],12),{w:3,c:'#9fb0ad',seed:5,a:.7});
  for(let i=-1;i<=1;i++)ink(X,seg([i*45,-40],[i*45,140],8),{w:2,c:'#9fb0ad',seed:6+i,a:.35});
  X.restore();
  // drop
  const mouthX=400+Math.sin(rot)*250,mouthY=700-Math.cos(rot)*250;
  if(T>15.1){const grow=lin(T,15.1,15.8),fall=lin(T,15.8,16.6);const r=4+grow*12;const y=mouthY+12+eo(fall)*0+fall*fall*900;
    X.fillStyle='#cfdcd8';X.beginPath();X.ellipse(mouthX,y+r,r*.8,r*(1+fall*.4),0,0,7);X.fill();}
  vignette(.85);sub(15.1,17.0,'A água acabou ontem.');
}

function S4(){ // 17-20 tally marks on wall
  X.drawImage(WALL,0,0);
  const s=mix(1,1.12,eio(lin(T,17,20)));X.save();X.translate(700,1150);X.scale(s,s);X.translate(-700,-1150);
  const lg=X.createRadialGradient(560,900,40,560,960,900);lg.addColorStop(0,'rgba(224,138,46,.16)');lg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=lg;X.fillRect(0,0,W,H);
  let n=0;const rows=[[0,1,2],[3,4,5],[6,7,8]];
  rows.forEach((r,ri)=>r.forEach((gi,ci)=>{const gx=180+ci*260,gy=640+ri*260;
    const cnt=gi<8?5:1;for(let k=0;k<cnt;k++){n++;const last=n===41;const pr=last?lin(T,18.5,19.2):1;
      if(k<4)ink(X,seg([gx+k*40,gy],[gx+k*40+4,gy+170],6),{w:7,c:'#d6ccb4',seed:n,p:pr,amp:2.6});
      else ink(X,seg([gx-20,gy+150],[gx+150,gy+30],8),{w:7,c:'#d6ccb4',seed:n,amp:2.6});}}));
  X.restore();vignette(.85);
}

function itemDrop(t0){const u=lin(T,t0,t0+.13);return T<t0?null:{s:1.25-.25*u,r:(1-u)*.12};}
function S5(){ // 20-27 floor items + notebook
  X.drawImage(FLOOR,0,0);
  const lg=X.createRadialGradient(540,980,60,540,1000,820);lg.addColorStop(0,'rgba(240,215,170,.17)');lg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=lg;X.fillRect(0,0,W,H);
  const S='#d9cfb8',F='#191714';
  const draw=(t0,x,y,a,fn)=>{const d=itemDrop(t0);if(!d)return;X.save();X.translate(x,y);X.rotate(a+d.r);X.scale(d.s,d.s);fn();X.restore();};
  const dim=T>22.6?1-.55*lin(T,22.6,23.4):1;X.globalAlpha=dim;
  draw(20.4,250,560,-.5,()=>{const b=poly([[-40,-150],[40,-150],[40,90],[-40,90]],5,true);ink(X,b,{fill:F,c:S,w:5,seed:11,close:true});
    const hd=poly([[-62,90],[62,90],[50,175],[-50,175]],4,true);ink(X,hd,{fill:F,c:S,w:5,seed:12,close:true});ink(X,ell(0,175,50,10,20),{c:S,w:3,seed:13});ink(X,seg([-20,-60],[20,-60],4),{c:S,w:4,seed:14});});
  draw(21.0,830,540,.35,()=>{const b=poly([[-34,-90],[34,-90],[34,90],[-34,90]],5,true);ink(X,b,{fill:F,c:S,w:5,seed:21,close:true});ink(X,poly([[-12,-90],[-12,-108],[12,-108],[12,-90]],2),{c:S,w:4,seed:22});ink(X,seg([-34,30],[34,30],5),{c:S,w:3,seed:23});X.fillStyle=S;X.font='40px Hand';X.textAlign='center';X.fillText('+',0,-30);X.textAlign='left';});
  draw(21.6,560,1460,.2,()=>{ink(X,ell(0,0,190,170,36,Math.PI,Math.PI*2).concat(seg([190,0],[-190,0],8)),{fill:F,c:S,w:6,seed:31});ink(X,seg([-150,-30],[150,-30],10),{c:S,w:4,seed:32});
    ink(X,seg([-60,-130],[10,-100],5),{c:S,w:2,seed:33,a:.7});ink(X,seg([20,-150],[90,-110],5),{c:S,w:2,seed:34,a:.7});ink(X,seg([-120,-90],[-70,-70],4),{c:S,w:2,seed:35,a:.7});});
  X.globalAlpha=1;
  // notebook pulled in
  if(T>22.6){const u=eo(lin(T,22.6,23.6));const y=mix(1700,960,u),s=mix(.8,1.12,eio(lin(T,23.6,27)));
    X.save();X.translate(540,y);X.scale(s,s);X.rotate(mix(.18,-.03,u));
    X.fillStyle='rgba(0,0,0,.5)';X.fillRect(-250,-330,520,700);
    const open=eio(lin(T,25.7,26.7));
    if(open>0){X.drawImage(PAGE,120,140,760,1020,-260,-350,520,700);}
    const cw=520*(1-open);const cover=poly([[-260,-350],[-260+cw,-350+open*20],[-260+cw,350-open*20],[-260,350]],8,true);
    if(cw>4){ink(X,cover,{fill:'#0e0d0c',c:'#5a554c',w:4,seed:41,close:true,amp:3});
      if(open<.3){ink(X,seg([-260+cw*.86,-350],[-260+cw*.86,350],12),{c:'#3a3631',w:10,seed:42});
        for(let i=0;i<6;i++)ink(X,seg([-240,-300+i*110],[-240+cw*.6,-290+i*110+h2(i,9)*30],6),{c:'rgba(120,110,95,.25)',w:2,seed:43+i});}}
    X.restore();}
  vignette(.8);
  sub(23.8,25.5,'Isso tava na minha mochila.');sub(25.7,27.0,'Não é meu.');
}

// ---- the notebook page (tall), camera tilts down ----
const D=1900;
function pageCam(){ // returns camY and zoom
  const keys=[[27,0],[33.0,0],[33.9,D-420],[37.9,D-420],[38.7,D+1020-560],[42.7,D+1020-560],[43.5,D+1940-170],[56,D+1940-170]];
  let y=0;for(let i=0;i<keys.length-1;i++){const [a,ya]=keys[i],[b,yb]=keys[i+1];if(T>=a&&T<=b){y=mix(ya,yb,eio(lin(T,a,b)));break;}if(T>b)y=yb;}
  return y;
}
const HF='76px Marker',BF='58px Hand',BFs='50px Hand';
function S7(){ // 27-52
