<style>
:root{--brand:#0B0B0B;--brand-ink:#0B0B0B;--eas:#5E5A54;--ink:#141416;--text:#2A2A2E;--muted:#68686F;--line:#E6E6E9;--soft:#F3F3F5;--page:#F4F4F6;--grid:#E6E6EA}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background-color:var(--page);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid #2563EB;outline-offset:3px}

/* header */
.hd{position:relative;overflow:hidden;background:var(--brand);color:#fff;padding:40px clamp(20px,4vw,48px) 36px}
.hd-mark{position:absolute;right:-60px;top:50%;transform:translateY(-50%);height:150%;width:auto;opacity:.07;pointer-events:none}
.hd-top{position:relative;display:flex;align-items:center;gap:28px;max-width:1240px;margin:0 auto}
.hd-logo{height:clamp(52px,7vw,84px);width:auto;flex-shrink:0}
.hd h1{font-size:clamp(30px,4.6vw,56px);font-weight:800;line-height:1.05;letter-spacing:-.01em}
.hd p{font-size:clamp(16px,1.6vw,21px);font-weight:500;margin-top:10px;opacity:.96}
.hd-ctl{position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1240px;margin:36px auto 0}
.seg{display:inline-flex;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.12)}
.seg button{padding:12px 26px;border-radius:999px;font-size:17px;font-weight:700;color:#fff;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{background:rgba(255,255,255,.14)}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:#fff;color:var(--brand-ink)}

/* page */
main{max-width:1288px;margin:0 auto;padding:44px 24px 56px}
.card{background:#fff;border:1px solid #ECECEF;border-radius:28px;padding:clamp(24px,3.4vw,44px);margin-bottom:28px;box-shadow:0 1px 2px rgba(20,20,22,.04)}
.ttl{font-size:clamp(26px,3vw,38px);font-weight:800;color:var(--brand-ink);line-height:1.15;margin-bottom:16px}
.lead{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--text);margin-bottom:22px}
.sub{font-size:18px;font-weight:700;color:var(--ink);margin:26px 0 12px}
.bul{padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:17px}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:16px 26px;border-radius:999px;background:var(--brand);color:#fff;font-size:17px;font-weight:700}
.btn:hover{background:#2A2A2E}

/* tables */
.tw{overflow-x:auto;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:17px}
th{background:var(--brand);color:#fff;font-weight:700;text-align:left;padding:15px 18px;white-space:nowrap}
td{padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{white-space:nowrap;font-weight:600;color:var(--ink)}
td small{display:block;color:var(--muted);font-size:15px;font-weight:500}
td .st{display:block;font-size:15px;line-height:1.5}
td .st b{color:var(--ink)}

/* week cards */
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.wk-head h2{font-size:clamp(26px,3vw,36px);font-weight:800;color:var(--ink);line-height:1.15}
.pill{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3A3A3F;background:var(--soft);padding:10px 18px;border-radius:999px}
.boxes{display:flex;gap:20px;margin-bottom:22px}
.box{flex:1;background:var(--soft);border-radius:18px;padding:20px 24px}
.box small{display:block;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:6px}
.box[data-acc=eas] small{color:var(--eas)}
.box p{font-size:18px;color:var(--ink)}
.box p b{font-weight:700}
.note{font-size:17px;line-height:1.6;margin-bottom:12px}
.note b{color:var(--ink)}

/* accordion */
.acc{margin-top:18px;border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.row-btn{width:100%;display:flex;align-items:center;gap:16px;padding:16px 0;text-align:left}
.plus{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;transition:transform .25s,background .2s}
.plus svg{width:14px;height:14px}
.row-btn:hover .plus{background:#3A3A3F}
.row-btn[aria-expanded=true] .plus{transform:rotate(45deg)}
.row-t{flex:1;font-size:19px;font-weight:700;color:var(--ink);line-height:1.3}
.row-t span{color:var(--brand-ink)}
.row[data-acc=eas] .row-t span{color:var(--eas)}
.row-m{flex-shrink:0;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap}
.panel{padding:2px 0 24px 56px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text);background:var(--soft);padding:7px 14px;border-radius:999px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--e,#9A9AA0)}
.panel p{font-size:16px;line-height:1.7;color:var(--text);margin-bottom:10px;max-width:880px;white-space:pre-line}
.panel p b{color:var(--ink)}

/* legend */
.leg{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.leg ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px}

/* account filter */
body[data-acc=gl] [data-acc=eas],body[data-acc=eas] [data-acc=gl]{display:none}

footer{max-width:1240px;margin:0 auto;padding:8px 24px 48px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:500;color:var(--muted)}

@media (max-width:760px){
  .hd{padding-top:28px}
  .hd-top{flex-direction:column;align-items:flex-start;gap:18px}
  .hd-ctl{flex-direction:column;align-items:stretch}
  .seg{overflow-x:auto}
  .seg button{padding:10px 16px;font-size:15px;flex:1}
  .boxes{flex-direction:column;gap:12px}
  .row-btn{flex-wrap:wrap;gap:6px 14px}
  .row-t{font-size:17px;flex-basis:calc(100% - 56px)}
  .row-m{margin-left:54px}
  .panel{padding-left:0}
  .leg{grid-template-columns:1fr}
  table{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

. 3) O que encurta a vida da cor. 4) Quando voltar ao salão. Abertura com a pergunta real de DM. Sem promessa de reverter o branco: não existe tecnologia que comprovadamente reverta (Maria Cecília Rivitti Machado, HC-FMUSP). Descrição com capítulos, link do mapa e três Shorts tirados do vídeo.","w":"Bruno"}],"stories":["Gancho: \"Tem salão Gloss perto de você?\": a cidade da semana","Processo: bastidores e caixa de perguntas","Resultado e chamada: ver o post e mandar para uma amiga"],"tags":["Mapa de salões","YouTube"],"traf":"Aquisição: educação presencial nas cidades com educador · Recompra: Black November · Agência: \"agenda cheia\""},"eas":{"sem":"semana: Contagem para as festas","tema":"Contagem para as festas","posts":[{"h":"12h","c":"Instagram + TikTok","p":"Achadinhos","i":"3 produtos para começar o cronograma hoje","o":"Venda direta na loja Eu amo salão"}],"stories":["Enquete sobre o assunto do dia: 3 produtos para começar o cronograma hoje","React e bastidor do assunto do dia","Desfecho e link: loja Eu amo salão"],"tags":["Achadinhos"],"traf":null,"ed":"Achadinhos"}},"2026-11-19":{"d":"2026-11-19","wd":3,"nota":null,"prep":null,"gl":{"sem":"semana de Técnica","tema":"Cronograma para as festas começa agora","posts":[{"h":"19h","c":"Instagram + TikTok","p":"Depoimentos","i":"\"Parei de retocar raiz em casa\": cliente 50+ e a cabeleireira dela","o":"Prova · CTA: mapadesaloes.com.br","r":"Vídeo de depoimento com duas vozes: cliente 50+ e a cabeleireira dela. Tema: \"parei de retocar raiz em casa\". Roteiro aberto, só três perguntas para a cliente: como era retocar em casa, o que mudou quando passou a fazer no salão, como se sente agora. Uma pergunta para a cabeleireira: o que ela vê de diferente no cabelo dessa cliente. Intercalar as falas com a aplicação e o resultado. Contexto para a legenda, sem tom de pesquisa: tem mulher que assume o branco e tem mulher que prefere cobrir, e as duas escolhas são legítimas. Um estudo da Universidade de Exeter com 80 mulher
