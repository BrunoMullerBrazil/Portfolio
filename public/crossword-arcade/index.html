<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}

<body>
<style>
/* Layout: o tabuleiro é a peça; o resto vira número e ícone em volta dele. Folha clara, linha preta, uma tinta azul (a do jogador). Tema único claro, por escolha. */
:root{
  --bg:#efede6; --cell:#fbfaf6; --cluebg:#e5e2d8; --line:#1d1d21; --soft:#d6d3c9;
  --fg:#1d1d21; --mute:#77756d;
  --ink:#1739d6; --ink2:#c9d4ff; --ink3:#e8ecff;
  --red:#d9262c; --ok:#2f9e5c;
  --f-ui:"Archivo",system-ui,sans-serif;
  --f-clue:"Archivo Narrow","Arial Narrow",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --cf:9px; --lf:34px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* topo: tempo e pontos grandes, o resto em linha */
.top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 16px}
.timer{font:800 clamp(40px,11vw,56px)/.9 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.score{text-align:right;font:800 clamp(28px,7vw,36px)/.9 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score small{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:4px}
.meta{grid-column:1/-1;display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:8px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:16px;height:16px}
.meta b{color:var(--fg);font-weight:700}
.meta .lvname{color:var(--fg)}
.meta .end{margin-left:auto}
#sCombo.hot{color:var(--ink)}

.board{position:relative}
.board.blur .gridbox{filter:blur(9px)}
.gridbox{position:relative;touch-action:manipulation}
#grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));border:2px solid var(--line);background:var(--line);gap:1px}
.cell{aspect-ratio:1;background:var(--cell);position:relative;overflow:hidden;color:var(--fg);user-select:none;-webkit-user-select:none}
.cell.x{background:var(--line)}
.cell.clue{background:var(--cluebg);display:flex;flex-direction:column;font-family:var(--f-clue);font-size:var(--cf);line-height:1.05;cursor:pointer}
.cq{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1px 6px 1px 2px;position:relative;overflow:hidden;hyphens:auto;-webkit-hyphens:auto}
.cq.d1{padding:1px 2px 7px}
.cq + .cq{border-top:1px solid #a9a69c}
.cq.on{background:var(--ink2)}
.cq.new{background:#d9eedf}
.ar{position:absolute;font-family:var(--f-ui);font-weight:800;color:var(--fg);font-size:calc(var(--cf) * 1.15);line-height:1}
.ar.a{right:1px;top:50%;transform:translateY(-50%)}
.ar.d{bottom:0;left:50%;transform:translateX(-50%)}
.cell.L{cursor:pointer}
.cell.L.inw{background:var(--ink3)}
.cell.L.cur{background:var(--ink2)}
.cell.L.lock{background:#d6ebdb}
.cq.lk{color:#5f7465;background:#dcebe0}
.cq.lk::before{content:"✓ ";font-weight:700;color:var(--ok)}
.cell.L.good{background:#bfe6cb}
.cell.L.bad{background:#f6c9c7}
.ch{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-hand);font-weight:400;padding-top:4%;color:var(--ink);font-size:var(--lf);line-height:1}
.cell.hint .ch{color:#8b8a84}
.rd{position:absolute;right:2px;bottom:1px;font:600 9px/1 var(--f-ui);color:#a3a29b}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
#ink.live{pointer-events:auto;cursor:crosshair}
#kbd{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font:800 36px/1 var(--f-ui);color:var(--ink);letter-spacing:-.02em;pointer-events:none;animation:pop 1s ease-out forwards;white-space:nowrap;text-shadow:0 0 0 #fff,0 2px 8px rgba(251,250,246,.9)}
@keyframes pop{from{opacity:1;transform:translate(-50%,-20%)}to{opacity:0;transform:translate(-50%,-130%)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),588px);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--line);color:#fff;font:600 14px/1.35 var(--f-ui);padding:10px 14px;display:flex;gap:10px;align-items:center;pointer-events:none;animation:toast 2.8s ease forwards;z-index:5}
.toast .ic{width:18px;height:18px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

/* dica ativa */
.cluebar{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;min-height:44px}
.cluebar .dir{width:32px;height:32px;display:grid;place-items:center;background:var(--line);color:#fff}
.cluebar .dir .ic{width:18px;height:18px}
.cluebar.lk .dir{background:var(--ok)}
.cluebar .ct{font:600 19px/1.25 var(--f-ui);min-width:0;text-wrap:balance}
.cluebar .ct.e{font-weight:400;color:var(--mute);font-size:16px}
.cluebar .len{grid-column:2;font-size:13px;color:var(--mute)}
.pat{grid-column:2;display:flex;gap:3px;flex-wrap:wrap}
.pat i{width:24px;height:28px;border:1px solid var(--line);background:var(--cell);display:grid;place-items:center;font:normal 700 14px/1 var(--f-ui);color:var(--ink)}
.pat i.cu{background:var(--ink2)}
.banco{font:600 13px/1.4 var(--f-clue);color:var(--mute);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.banco b{font:800 11px/1 var(--f-ui);letter-spacing:.08em;color:var(--fg)}

/* ferramentas: só ícones */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 10px repeat(4,minmax(0,1fr));gap:4px}
.tools .sp{width:10px}
.tb{height:48px;border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--fg);background:var(--cell)}
.tb .ic{width:22px;height:22px}
.tb[aria-pressed="true"]{background:var(--line);color:#fff}
.tb.mk[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.tb small{position:absolute;right:3px;bottom:2px;font:700 10px/1 var(--f-ui);color:var(--red);font-variant-numeric:tabular-nums}
.tb:hover{background:#fff}
.tb[aria-pressed="true"]:hover{background:var(--line)}
.tb.mk[aria-pressed="true"]:hover{background:var(--red)}
.tb:active{transform:translateY(1px)}
.cap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 10px repeat(4,minmax(0,1fr));gap:4px;margin-top:-8px;font-size:11px;color:var(--mute);text-align:center}

/* telas */
#ov[hidden]{display:none}
#ov{position:fixed;inset:0;background:rgba(239,237,230,.97);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));z-index:20;overflow:auto}
.panel{max-width:440px;width:100%;display:flex;flex-direction:column;gap:22px;max-height:100%;overflow:auto;padding:4px}
.logo{display:grid;gap:4px;justify-items:start}
.logo div{display:flex;gap:4px}
.logo i{width:clamp(32px,9vw,40px);aspect-ratio:1;border:2px solid var(--line);display:grid;place-items:center;font:normal 800 clamp(17px,5vw,22px)/1 var(--f-ui);background:var(--cell)}
.logo i.x{background:var(--line)}
.logo i.b{color:var(--ink)}
.panel p{margin:0;line-height:1.5;font-size:15px;color:var(--mute);max-width:40ch}
.panel h2{margin:0 0 -12px;font:700 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lvls{display:grid;border-top:1px solid var(--line)}
.lv{display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}
.lv .bars{grid-row:span 2;display:flex;gap:2px;align-items:flex-end;height:18px}
.lv .bars span{width:5px;background:var(--soft)}
.lv .bars span.f{background:currentColor}
.lv b{font:800 17px/1.1 var(--f-ui)}
.lv span.d{font-size:13px;color:var(--mute);grid-column:2}
.lv em{grid-row:1/span 2;grid-column:3;font:normal 700 15px/1 var(--f-ui);font-variant-numeric:tabular-nums;display:flex;gap:5px;align-items:center}
.lv em .ic{width:15px;height:15px;color:var(--mute)}
.lv em.no{color:var(--mute);font-weight:400;font-size:13px}
.lv.on{background:var(--line);color:#fff}
.lv.on span.d,.lv.on em .ic{color:#b9b8b2}
.lv.on .bars span{background:#55555b}.lv.on .bars span.f{background:#fff}
.big{font:800 clamp(64px,20vw,96px)/.85 var(--f-ui);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.facts{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--mute)}
.facts span{display:inline-flex;gap:6px;align-items:center}
.facts .ic{width:17px;height:17px}
.facts b{color:var(--fg)}
.btn{height:52px;padding:0 20px;background:var(--line);color:#fff;font:700 16px/1 var(--f-ui);display:inline-flex;gap:10px;align-items:center;justify-content:center;flex:1}
.btn .ic{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:hover{background:#000}.btn.ghost:hover{background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.rank td{padding:7px 4px;border-bottom:1px solid var(--soft)}
.rank td:first-child{color:var(--mute);width:2em}
.rank td.n{font-weight:800;letter-spacing:.14em}
.rank td.w{color:var(--mute);font-size:12px}
.rank td.s{text-align:right;font-weight:800}
.rank tr.me td{color:var(--ink)}
.empty{font-size:14px;color:var(--mute);border-top:1px solid var(--soft);padding-top:10px}
.ini{display:flex;gap:10px;align-items:end}
#ini{background:transparent;color:var(--fg);border:0;border-bottom:2px solid var(--line);font:800 34px/1 var(--f-ui);letter-spacing:.35em;width:5.2em;padding:0 0 4px;text-transform:uppercase;border-radius:0}
.pz{display:grid;place-items:center;gap:18px;text-align:center}
.pz .ic{width:56px;height:56px;stroke-width:1.5}
.help dl{margin:0;display:grid;grid-template-columns:28px 1fr;gap:12px 12px;align-items:start;font-size:14px;line-height:1.45}
.help dt{display:grid;place-items:center;height:22px}
.help dd{margin:0}
.help dd b{display:block}
kbd{font:600 12px var(--f-ui);border:1px solid var(--soft);padding:1px 5px;background:var(--cell)}
@media (prefers-reduced-motion:reduce){.pop,.timer.low,.toast{animation:none}}
@media (max-width:440px){.tb{height:44px}.tb .ic{width:20px;height:20px}.cluebar .ct{font-size:17px}.cap{display:none}}

/* efeitos de jogo */
.top{position:relative}
#sCombo{display:inline-block}
#sCombo.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.6)}}
.timer.low{animation:beat .5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.06)}}
.cell.L.good{background:var(--ink);z-index:2;animation:win .55s cubic-bezier(.3,1.7,.5,1) var(--d,0ms) both}
.cell.L.good .ch{color:#fff}
.cell.L.good .rd{display:none}
@keyframes win{0%{transform:scale(1);background:var(--cell)}45%{transform:scale(1.2)}100%{transform:scale(1);background:var(--ink)}}
.cell.L.bad{animation:badf .45s steps(2) 2}
@keyframes badf{50%{background:var(--red)}}
.board.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,0)}20%,80%{transform:translate(5px,1px)}30%,50%,70%{transform:translate(-9px,-1px) rotate(-.5deg)}40%,60%{transform:translate(9px,1px) rotate(.5deg)}}
.pt{position:absolute;width:8px;height:8px;pointer-events:none;z-index:6;animation:pt .85s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes pt{0%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 50px)) rotate(var(--r)) scale(.6);opacity:0}}
.tplus{position:absolute;font:800 22px/1 var(--f-ui);color:var(--ok);pointer-events:none;animation:tplus 1.1s ease-out forwards}
@keyframes tplus{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-18px)}}
.stagebn{position:absolute;left:-8px;right:-8px;top:38%;display:grid;justify-items:center;gap:6px;padding:20px 0;background:var(--line);color:#fff;z-index:7;pointer-events:none;animation:stg 1.8s cubic-bezier(.2,.9,.3,1) forwards}
.stagebn b{font:800 48px/1 var(--f-ui);letter-spacing:-.03em}
.stagebn span{font-size:14px;font-weight:600;color:#c9c8c2}
@keyframes stg{0%{clip-path:inset(50% 0 50% 0)}14%,82%{clip-path:inset(0)}100%{clip-path:inset(50% 0 50% 0)}}
.sfx{display:inline-flex;align-items:center;color:var(--mute)}
.sfx:hover{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.cell.L.good,.cell.L.bad,.board.shake,.pt,.tplus,.stagebn,#sCombo.bump,.timer.low{animation:none}.pt{display:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8M12 17h.01"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v15M6 13l6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 9.5l5 5M22 9.5l-5 5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
</svg>
<div class="wrap">
  <div class="top">
    <div class="timer" id="timer" aria-label="Tempo restante">1:00</div>
    <div class="score"><span id="sScore">0</span><small>pts</small></div>
    <div class="meta">
      <span class="lvname" id="sLevel">Médio</span>
      <span title="Fase"><svg class="ic"><use href="#i-layers"/></svg>fase <b id="sStage">1</b><span id="sClock"></span></span>
      <span title="Combo"><svg class="ic"><use href="#i-flame"/></svg><b id="sCombo">×1</b></span>
      <span title="Palavras resolvidas"><svg class="ic"><use href="#i-words"/></svg><b id="tab">0</b></span>
      <button class="sfx end" id="sfx" aria-label="Som ligado" title="Som"><svg class="ic"><use href="#i-sound"/></svg></button>
      <span title="Recorde"><svg class="ic"><use href="#i-trophy"/></svg><b id="sBest">0</b></span>
    </div>
  </div>

  <div class="board" id="board">
    <div class="gridbox" id="gridbox">
      <div id="grid"></div>
      <canvas id="ink"></canvas>
      <input id="kbd" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Entrada de letras">
    </div>
  </div>

  <div class="cluebar" id="cluebar"></div>
  <div class="banco" id="banco" hidden></div>

  <div class="tools">
    <div id="modes" role="group" aria-label="Modo de entrada" style="display:contents">
      <button class="tb" data-mode="key" aria-pressed="true" aria-label="Teclado" title="Teclado"><svg class="ic"><use href="#i-key"/></svg></button>

const parse=raw=>{const m=new Map();for(const line of raw.split("\n")){const [w,c]=line.split("|");if(!w||!c)continue;const W=w.trim().toUpperCase();if(/^[A-Z]{2,8}$/.test(W)&&!m.has(W))m.set(W,c.trim())}return m};
const BASE=parse(RAW), HARDC=parse(RAW_HARD);

for(const [w] of HARDC)if(!BASE.has(w))RARE.add(w);

const POOLS={
  easy:[...BASE].filter(([w])=>w.length<=6).map(([w,clue])=>({w,clue})).concat(fillFor(1)),
  med:[...BASE].map(([w,clue])=>({w,clue})).concat(fillFor(2)),
  hard:[...HARDC].map(([w,clue])=>({w,clue})).concat(fillFor(3))
};

   ajuda custa mais, a janela de combo encolhe e as dicas migram para o nível de cima. */
const PER_STAGE=6;

const STEPS={easy:[[1,['easy']],[3,['easy','med']],[6,['med','hard']]],med:[[1,['med']],[3,['med','hard']],[6,['hard']]],hard:[[1,['hard']]]};
function dictFor(){
  const mix=STEPS[level].filter(([s])=>stage>=s).pop()[1], m=new Map();
  mix.forEach(k=>POOLS[k].forEach(e=>m.set(e.w,e)));
  return [...m.values()];
}
const R={
  clock:()=>Math.min(2.2,1+.15*(stage-1)),
  bonus:n=>Math.max(stage>=8?0:1,Math.round((LV.bonus+n)*Math.pow(.85,stage-1))),
  cost:c=>Math.round(c*(1+.25*(stage-1))),
  win:()=>LV.win*Math.max(.5,1-.08*(stage-1)),
  gift:()=>LV.gift&&stage<4
};
function stageCheck(){

  stage=ns;DICT=dictFor();
  const msg=['','','Fase 2 · o relógio acelera','Fase 3 · dicas mais difíceis','Fase 4 · combo mais curto'][stage]||`Fase ${stage} · relógio ×${R.clock().toFixed(2).replace('.',',')}`;

const esc=s=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- tabuleiro ---------- */
const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
const cell=(r,c)=>inB(r,c)?grid[r][c]:null;
const isL=(r,c)=>{const g=cell(r,c);return !!g&&g.t==='L'};
const other=d=>d==='a'?'d':'a';

function emptyBoard(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));words=new Map();}

function canPlace(w,r0,c0,d){
  const dr=d==='d'?1:0, dc=d==='a'?1:0, n=w.length;
  const cr=r0-dr, cc=c0-dc; if(!inB(cr,cc))return null;
  const cg=grid[cr][cc]; if(cg&&(cg.t!=='C'||cg[d]))return null;
  if(!inB(r0+dr*(n-1),c0+dc*(n-1)))return null;
  if(isL(r0+dr*n,c0+dc*n))return null;
  let x=0,nw=0;
  for(let i=0;i<n;i++){
    const r=r0+dr*i,c=c0+dc*i,g=grid[r][c];
    if(g){ if(g.t!=='L'||g.sol!==w[i]||g.w[d])return null; x++; }
    else{ if(isL(r+dc,c+dr)||isL(r-dc,c-dr))return null; nw++; }
  }
  return {x,nw};
}
function place(entry,r0,c0,d){
  const id=nextId++, dr=d==='d'?1:0, dc=d==='a'?1:0, cells=[];
  for(let i=0;i<entry.w.length;i++){
    const r=r0+dr*i,c=c0+dc*i;
    if(!grid[r][c])grid[r][c]={t:'L',sol:entry.w[i],ent:'',ink:null,read:null,hint:false,w:{a:null,d:null}};
    grid[r][c].w[d]=id; cells.push([r,c]);
  }
  const cr=r0-dr,cc=c0-dc;
  if(!grid[cr][cc])grid[cr][cc]={t:'C',a:null,d:null};
  grid[cr][cc][d]=id;
  words.set(id,{id,w:entry.w,clue:entry.clue,dir:d,cells,clueAt:[cr,cc],born:performance.now()});
  recent.push(entry.w); if(recent.length>70)recent.shift();
  return id;
}
function removeWord(id){
  const o=words.get(id); if(!o)return;
  for(const [r,c] of o.cells){const g=grid[r][c];g.w[o.dir]=null;if(!g.w.a&&!g.w.d)grid[r][c]=null;}
  const [cr,cc]=o.clueAt, cg=grid[cr][cc]; cg[o.dir]=null; if(!cg.a&&!cg.d)grid[cr][cc]=null;
  words.delete(id);
}
function fillOnce(){
  let guard=0, added=[];
  while(words.size<MAXW&&guard++<40){
    const onBoard=new Set([...words.values()].map(o=>o.w)), empty=words.size===0;
    const pool=shuffle(DICT.filter(d=>!onBoard.has(d.w)&&!recent.includes(d.w)));
    let best=null;
    const twoCount=[...words.values()].filter(o=>o.w.length===2).length;
    for(const e of pool)for(const d of ['a','d'])for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(e.w.length===2&&twoCount>=5)continue;
      const res=canPlace(e.w,r,c,d); if(!res||res.nw<Math.min(2,e.w.length-1))continue;
      // cruzar é o objetivo; palavra solta só entra se nada cruzar
      const s=res.x*5+res.nw*.7+Math.random()*3-(res.x?0:9)-(empty?(Math.abs(r-1)+Math.abs(c-1))*2:0);
      if(!best||s>best.s)best={s,e,r,c,d};
    }
    if(!best)break;
    added.push(place(best.e,best.r,best.c,best.d));
  }
  return added;
}
function boardValue(){
  let L=0,X=0,C=0;
  for(const row of grid)for(const g of row){if(!g)continue;if(g.t==='C')C++;else{L++;if(g.w.a&&g.w.d)X++}}
  return L+C+X*2;
}
const snap=()=>({grid:grid.map(r=>r.map(g=>g&&JSON.parse(JSON.stringify(g)))),words:new Map([...words].map(([k,v])=>[k,{...v,cells:v.cells.map(x=>x.slice())}])),nextId,recent:recent.slice()});
const restore=s=>{grid=s.grid;words=s.words;nextId=s.nextId;recent=s.recent};
function fill(tries=8){const ad=fillRaw(tries);if(R.gift())ad.forEach(id=>{const o=words.get(id);if(!o)return;const em=o.cells.filter(([r,c])=>!grid[r][c].ent);if(em.length<2)return;const [r,c]=em[0];setEntry(r,c,grid[r][c].sol,{hint:true})});return ad}
function fillRaw(tries){
  const base=snap(); let best=null;
  for(let i=0;i<tries;i++){
    if(i)restore(cloneOf(base));
    const added=fillOnce(), v=boardValue()+Math.random();
    if(!best||v>best.v)best={v,state:snap(),added};
  }
  restore(best.state);
  const now=performance.now(); best.added.forEach(id=>{const o=words.get(id);if(o)o.born=now});
  if(best.added.length)setTimeout(render,2700);
  return best.added;
}
function cloneOf(s){return {grid:s.grid.map(r=>r.map(g=>g&&JSON.parse(JSON.stringify(g)))),words:new Map([...s.words].map(([k,v])=>[k,{...v,cells:v.cells.map(x=>x.slice())}])),nextId:s.nextId,recent:s.recent.slice()}}

/* troca no mesmo lugar: a nova palavra respeita as letras que cruzam.
   Sem substituta possível, a palavra resolvida fica travada até uma palavra que a cruza ser resolvida. */
const isLocked=id=>!!(id&&words.get(id)?.locked);
const lockedCell=(r,c)=>{const g=cell(r,c);return !!g&&g.t==='L'&&(isLocked(g.w.a)||isLocked(g.w.d))};
function bestFor(slot){
  const onBoard=new Set([...words.values()].map(o=>o.w));
  const two=[...words.values()].filter(o=>o.w.length===2).length;
  let best=null;
  for(const e of DICT){
    const n=e.w.length;
    if(n>slot.len||onBoard.has(e.w)||recent.includes(e.w)||(n===2&&two>=5))continue;
    const res=canPlace(e.w,slot.r,slot.c,slot.dir); if(!res||res.nw<Math.min(2,n-1))continue;
    const sc=(n===slot.len?8:0)+n+res.x*3+Math.random()*4;
    if(!best||sc>best.sc)best={sc,e};
  }
  return best&&best.e;
}
function replaceWords(ids,lockKept){
  const S=new Set(ids);
  for(const id of ids){const o=words.get(id);for(const [r,c] of o.cells){const ot=grid[r][c].w[other(o.dir)];if(isLocked(ot))S.add(ot)}}
  const base=snap(), keep=new Set(), drop=new Set();
  let out=null;
  for(let guard=0;guard<=S.size&&!out;guard++){
    restore(cloneOf(base));
    const slots=[...S].filter(id=>!keep.has(id)).map(id=>{const o=words.get(id);return {id,r:o.cells[0][0],c:o.cells[0][1],dir:o.dir,len:o.w.length}});
    slots.forEach(sl=>removeWord(sl.id));
    const added=[];let failed=null;
    for(const sl of shuffle(slots.filter(sl=>!drop.has(sl.id)))){const e=bestFor(sl);if(!e){failed=sl.id;break}added.push(place(e,sl.r,sl.c,sl.dir))}
    if(failed===null)out={added,kept:[...keep]};
    else if(ids.includes(failed))keep.add(failed);   // recém-resolvida sem substituta: fica
    else drop.add(failed);                             // travada antiga: a vez dela chegou, sai sem substituta
  }
  if(!out){restore(cloneOf(base));out={added:[],kept:[...ids]}}
  if(lockKept)out.kept.forEach(id=>{const o=words.get(id);if(o)o.locked=true});
  releaseStuck();
  return out;
}
// uma travada só sai quando uma palavra que a cruza é resolvida; se nenhuma jogável a cruza, ela sai já
function releaseStuck(){
  let again=true;
  while(again){
    again=false;
    for(const o of [...words.values()]){
      if(!o.locked)continue;
      const live=o.cells.some(([r,c])=>{const ot=grid[r][c].w[other(o.dir)];return ot&&!isLocked(ot)});
      if(!live){removeWord(o.id);again=true}
    }
  }
}
function giftLetters(ids){
  if(!R.gift())return;
  ids.forEach(id=>{const o=words.get(id);if(!o)return;const em=o.cells.filter(([r,c])=>!grid[r][c].ent);if(em.length<2)return;const [r,c]=em[0];setEntry(r,c,grid[r][c].sol,{hint:true})});
}

/* ---------- seleção ---------- */
function activeId(){const g=cell(cur.r,cur.c);if(!g||g.t!=='L')return null;const a=g.w[dir],b=g.w[other(dir)];if(a&&isLocked(a)&&b&&!isLocked(b))return b;return a||b}
function selectWord(id){
  const o=words.get(id); if(!o)return; dir=o.dir;
  const e=o.cells.find(([r,c])=>grid[r][c].ent!==grid[r][c].sol)||o.cells[0];
  cur={r:e[0],c:e[1]};
}
function fixCursor(prefer){
  const g=cell(cur.r,cur.c);
  if(g&&g.t==='L'){if(!g.w[dir])dir=other(dir);if(!isLocked(activeId()))return}
  const live=id=>words.has(id)&&!isLocked(id);
  const ids=(prefer||[]).filter(live);
  const pick=ids.length?ids[ids.length-1]:[...words.keys()].filter(live).pop();
  if(pick)selectWord(pick);
}
function handleTap(r,c,wid){
  if(wid){selectWord(wid);render();return}
  const g=cell(r,c); if(!g)return;
  if(g.t==='L'){
    if(cur.r===r&&cur.c===c&&g.w[other(dir)])dir=other(dir);
    else{cur={r,c};if(!g.w[dir])dir=other(dir)}
  }else if(g.t==='C'){
    const ids=[g.a,g.d].filter(Boolean), act=activeId();
    selectWord(ids.length===2&&ids[0]===act?ids[1]:ids[0]);
  }
  render();
}

/* ---------- entrada ---------- */
function setEntry(r,c,ch,opts={}){
  if(lockedCell(r,c))return;
  const g=cell(r,c); if(!g||g.t!=='L')return;
  g.ent=ch; g.ink=opts.ink||null; g.read=opts.read||null; g.hint=!!opts.hint;
}
function advance(){
  const id=activeId(), o=words.get(id); if(!o)return;
  const i=o.cells.findIndex(([r,c])=>r===cur.r&&c===cur.c);
  let nx=o.cells.slice(i+1).find(([r,c])=>!grid[r][c].ent);
  if(!nx&&i+1<o.cells.length)nx=o.cells[i+1];
  if(nx)cur={r:nx[0],c:nx[1]};
}
function typeLetter(ch){
  if(!playing||paused||busy)return;
  const {r,c}=cur; if(!isL(r,c))return;
  setEntry(r,c,ch); SFX.key(); advance(); render(); check(r,c);
}
function backspace(){
  if(!playing||paused||busy)return;
  const g=cell(cur.r,cur.c); if(!g||g.t!=='L')return;
  if(g.ent){setEntry(cur.r,cur.c,'');}
  else{
    const o=words.get(activeId()); if(o){const i=o.cells.findIndex(([r,c])=>r===cur.r&&c===cur.c);if(i>0){cur={r:o.cells[i-1][0],c:o.cells[i-1][1]};setEntry(cur.r,cur.c,'');}}
  }
  render();
}
function moveArrow(dr,dc){
  let r=cur.r+dr,c=cur.c+dc;
  while(inB(r,c)&&!isL(r,c)){r+=dr;c+=dc}
  if(inB(r,c)){cur={r,c};const d=dc?'a':'d';const g=grid[r][c];dir=g.w[d]?d:other(d)}
  render();
}
function nextWord(back){
  const ids=[...words.keys()].sort((a,b)=>{const A=words.get(a).clueAt,B=words.get(b).clueAt;return A[0]-B[0]||A[1]-B[1]});
  if(!ids.length)return;
  const i=ids.indexOf(activeId());
  selectWord(ids[(i+(back?-1:1)+ids.length)%ids.length]);render();
}

/* ---------- conferência e pontuação ---------- */
function check(r,c){
  const g=cell(r,c); if(!g||g.t!=='L')return;
  const done=[], wrong=[];
  for(const id of [g.w.a,g.w.d]){
    if(isLocked(id))continue;
    if(!id)continue; const o=words.get(id);
    if(!o.cells.every(([r,c])=>grid[r][c].ent))continue;
    if(o.cells.every(([r,c])=>grid[r][c].ent===grid[r][c].sol))done.push(id);
    else wrong.push(o);
  }
  if(wrong.length){
    wrong.forEach(o=>o.cells.forEach(([r,c])=>{if(grid[r][c].ent!==grid[r][c].sol)badCells.add(r*COLS+c)}));
    render(); shake(); setTimeout(()=>{badCells.clear();render()},900);
  }
  if(done.length)solve(done);
}
function solve(ids){
  busy=true;
  const ml=Math.max(...ids.map(id=>words.get(id).w.length));const maxLen=()=>ml;
  const now=performance.now();
  combo=(now-lastSolve<R.win())?Math.min(combo+1,5):1; lastSolve=now; bestCombo=Math.max(bestCombo,combo);
  let pts=0, plus=0;
  for(const id of ids){
    const o=words.get(id);
    pts+=o.w.length*10;
    const tb=R.bonus(o.w.length);timeLeft+=tb;plus+=tb;
    burst(o.cells);
    solved++;
    o.cells.forEach(([r,c],i)=>{const k=r*COLS+c;if(!goodCells.has(k))goodCells.set(k,i)});
  }
  pts=Math.round(pts*combo*LV.mult*(1+.1*(stage-1))); if(ids.length>1)pts=Math.round(pts*1.5);
  score+=pts;
  timePlus(plus);SFX.win(combo);buzz(25);
  stageCheck();
  popup(`+${pts}${combo>1?'  ×'+combo:''}${ids.length>1?'  DUPLA':''}`);
  render();
  setTimeout(()=>{
    goodCells.clear();
    const rp=replaceWords(ids,true);
    giftLetters(rp.added);
    const added=rp.added.concat(fill());
    if(rp.kept.some(id=>ids.includes(id))){SFX.lock();}
    if(rp.kept.some(id=>ids.includes(id)))toast('Sem substituta: a palavra fica travada até você resolver uma que a cruza.','lock');
    fixCursor(added);
    busy=false; render();
  },Math.max(560,maxLen(ids)*55+420));
}
function popup(t){
  const el=document.createElement('div');el.className='pop';el.textContent=t;
  $('#board').appendChild(el);setTimeout(()=>el.remove(),1000);
}
function hint(){
  if(!playing||paused||busy)return;
  if(isLocked(activeId()))fixCursor();
  const o=words.get(activeId()); if(!o)return;
  let tgt=null; const g=cell(cur.r,cur.c);

  else if(e.key==='ArrowUp'){e.preventDefault();moveArrow(-1,0)}
  else if(e.key==='Tab'){e.preventDefault();nextWord(e.shiftKey)}
  else if(e.key===' '){e.preventDefault();const g=cell(cur.r,cur.c);if(g&&g.w[other(dir)]){dir=other(dir);render()}}
});
kbd.addEventListener('input',()=>{
  const v=norm(kbd.value);kbd.value='';
  for(const ch of v)if(/[A-Z]/.test(ch))typeLetter(ch);
});
function toast(t,icon='info'){const el=document.createElement('div');el.className='toast';el.innerHTML=`<svg class="ic"><use href="#i-${icon}"/></svg><span></span>`;el.lastChild.textContent=t;$('#board').appendChild(el);setTimeout(()=>el.remove(),2800)}

/* ---------- jogo ---------- */
let startedAt=0;
const ov=$('#ov');
function rankTable(hi){
  if(!ranking.length)return '<p class="empty">Nenhum recorde ainda neste aparelho.</p>';
  return `<table class="rank">${ranking.map((x,i)=>`<tr class="${i===hi?'me':''}"><td>${i+1}</td><td class="n">${esc(x.n)}</td><td class="w">${x.f?'fase '+x.f+' · ':''}${x.w} pal.</td><td class="s">${x.s.toLocaleString('pt-BR')}</td></tr>`).join('')}</table>`;
}
function _ic(n){return `<svg class="ic"><use href="#i-${n}"/></svg>`}
function levelCards(){
  return `<div class="lvls" role="radiogroup" aria-label="Dificuldade">${Object.entries(LEVELS).map(([k,v],i)=>{const best=(load(':rank-'+k)||[])[0];const bars=[0,1,2].map(j=>`<span class="${j<=i?'f':''}" style="height:${6+j*6}px"></span>`).join('');return `<button class="lv${k===level?' on':''}" role="radio" aria-checked="${k===level}" data-lv="${k}"><span class="bars" aria-hidden="true">${bars}</span><b>${v.name}</b><span class="d">${v.desc}</span>${best?`<em>${_ic('trophy')}${best.s.toLocaleString('pt-BR')}</em>`:'<em class="no">sem recorde</em>'}</button>`}).join('')}</div>`;
}
function showStart(){
  ov.hidden=false;
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="Início">
    <h1 class="logo" aria-label="Cruzada Sem Fim"><div>${[...'CRUZADA'].map(c=>`<i>${c}</i>`).join('')}</div><div><i>S</i><i>E</i><i>M</i><i class="x"></i><i>F</i><i class="b">I</i><i>M</i></div></h1>
    <p>Resolva a palavra e ela troca por outra que cruza as que ficaram. O relógio acelera a cada fase.</p>
    <h2>Dificuldade</h2>${levelCards()}
    <h2>Recordes · <span id="rkname">${LV.name}</span></h2><div id="rk">${rankTable(-1)}</div>
    <div class="row"><button class="btn" data-go="start">${_ic('play')}Começar</button><button class="btn ghost" data-go="help" style="flex:0 0 52px;padding:0" aria-label="Como jogar">${_ic('help')}</button></div>
  </div>`;
}
function startGame(){
  emptyBoard();recent=[];score=0;combo=1;bestCombo=1;lastSolve=-1e9;timeLeft=LV.time;solved=0;stage=1;shown=0;DICT=dictFor();marks=[];
  startedAt=performance.now()+1e9; fill(); startedAt=performance.now();
  fixCursor();playing=true;paused=false;busy=false;ov.hidden=true;ov.innerHTML='';
  $('#board').classList.remove('blur');render();
  if(mode==='key')kbd.focus({preventScroll:true});
}
function togglePause(){
  if(!playing)return;
  paused=!paused;$('#board').classList.toggle('blur',paused);
  const pb=document.querySelector('[data-act="pause"]');pb.innerHTML=_ic(paused?'play':'pause');pb.setAttribute('aria-label',paused?'Continuar':'Pausar');
  if(paused){ov.hidden=false;ov.innerHTML=`<div class="panel pz">${_ic('pause')}<p>Tempo parado. O tabuleiro fica escondido.</p><div class="row" style="width:100%"><button class="btn" data-go="resume">${_ic('play')}Continuar</button></div></div>`}
  else{ov.hidden=true;ov.innerHTML=''}
}
function showHelp(){
  const live=playing&&!paused;
  if(live)togglePause();
  ov.hidden=false;
  ov.innerHTML=`<div class="panel help" role="dialog" aria-label="Como jogar">
    <h2>Como jogar</h2>
    <dl>
      <dt>${_ic('key')}</dt><dd><b>Teclado</b>Digite as letras. <kbd>Tab</kbd> pula de palavra, <kbd>espaço</kbd> troca a direção, setas andam no grid.</dd>
      <dt>${_ic('pen')}</dt><dd><b>Caneta</b>Escreva a letra maiúscula dentro da casa, com dedo, mouse ou mesa digitalizadora. A letra lida aparece no canto.</dd>
      <dt>${_ic('mark')}</dt><dd><b>Marcador</b>Rabisco vermelho livre para circular dicas. Some sozinho.</dd>
      <dt>${_ic('erase')}</dt><dd><b>Borracha</b>Toque na casa para apagar. A ponta borracha da caneta também apaga.</dd>
      <dt>${_ic('bulb')}</dt><dd><b>Letra e trocar</b>Revelam uma letra ou trocam a palavra. Custam tempo.</dd>
      <dt>${_ic('lock')}</dt><dd><b>Palavra travada</b>Quando não há substituta, ela fica até você resolver uma palavra que a cruza.</dd>
      <dt>${_ic('layers')}</dt><dd><b>Fases</b>A cada 6 palavras o relógio acelera e as dicas ficam mais difíceis.</dd>
    </dl>
    <div class="row"><button class="btn" data-go="${playing?'resume':'menu'}">${_ic(playing?'play':'back')}${playing?'Voltar ao jogo':'Voltar'}</button></div>
  </div>`;
}
function gameOver(){
  playing=false;finalize();SFX.over();buzz([60,40,120]);
  const qualifies=score>0&&(ranking.length<10||score>ranking[ranking.length-1].s);
  ov.hidden=false;
  ov.innerHTML=`<div class="panel" role="dialog" aria-label="Fim de jogo">
    <h2>Tempo esgotado · ${LV.name}</h2>
    <div class="big">${score.toLocaleString('pt-BR')}</div>
    <div class="facts"><span>${_ic('layers')}fase <b>${stage}</b></span><span>${_ic('words')}<b>${solved}</b> palavra${solved===1?'':'s'}</span><span>${_ic('flame')}combo <b>×${bestCombo}</b></span></div>
    ${qualifies?`<h2>Novo recorde · suas iniciais</h2><div class="ini"><input id="ini" maxlength="3" value="${esc(load(':ini')||'')}" aria-label="Iniciais"><button class="btn" data-go="save" style="flex:0 0 auto">${_ic('check')}Salvar</button></div>`:''}
    <h2>Recordes</h2><div id="rk">${rankTable(-1)}</div>
    <div class="row"><button class="btn${qualifies?' ghost':''}" data-go="start">${_ic('play')}Jogar de novo</button><button class="btn ghost" data-go="menu">${_ic('back')}Dificuldade</button></div>
  </div>`;
  if(qualifies)setTimeout(()=>{const i=$('#ini');i&&i.focus();i&&i.select()},50);
  hud();
}
function saveScore(){
  const i=$('#ini');if(!i)return;
  const n=(norm(i.value).replace(/[^A-Z]/g,'')||'???').slice(0,3);save(':ini',n);
  const entry={n,s:score,w:solved,f:stage,t:Date.now()};
  ranking.push(entry);ranking.sort((a,b)=>b.s-a.s);ranking=ranking.slice(0,10);save(RK(),ranking);
  const blk=i.closest('.ini');blk.previousElementSibling.remove();blk.remove();
  $('#rk').innerHTML=rankTable(ranking.indexOf(entry));
  ov.querySelector('[data-go="start"]').classList.remove('ghost');hud();
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-lv]');if(!b)return;
  const g=b.dataset.go;
  if(b.dataset.lv){setLevel(b.dataset.lv);ov.querySelectorAll('.lv').forEach(x=>{const on=x.dataset.lv===level;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});$('#rkname').textContent=LV.name;$('#rk').innerHTML=rankTable(-1);hud();return}
  if(g==='menu'){showStart();return}
  if(g==='help'){showHelp();return}
  if(g==='start')startGame();else if(g==='resume')togglePause();else if(g==='save')saveScore();
});
ov.addEventListener('keydown',e=>{if(e.target.id==='ini'&&e.key==='Enter')saveScore()});

let lastT=performance.now();
function tick(t){
  const dt=Math.min(.25,(t-lastT)/1000);lastT=t;
  if(playing&&!paused){const before=Math.ceil(timeLeft);timeLeft-=dt*R.clock();if(timeLeft>0&&timeLeft<=5&&Math.ceil(timeLeft)!==before)SFX.tick();if(timeLeft<=0){timeLeft=0;gameOver()}}
  hud();requestAnimationFrame(tick);
}

/* ---------- boot ---------- */
emptyBoard();startedAt=performance.now()+1e9;fill();fixCursor();
setMode(mode);
new ResizeObserver(resize).observe(gridBox);
render();resize();showStart();
requestAnimationFrame(tick);
})();
</script>

</body>
</html>
